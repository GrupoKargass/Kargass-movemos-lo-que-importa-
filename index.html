<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargass - Gestión de Acarreos</title>
    <!-- Firebase App (Base de datos en tiempo real) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #ff9800; text-align: center; }
        .btn { display: block; width: 100%; background: #ff9800; color: #fff; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #e68900; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kargass Logística</h1>
        <p style="text-align: center;">Plataforma de Acarreos en Tiempo Real</p>
        <div id="app-status" style="background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 20px;">
            <h3>Estado de Conexión</h3>
            <p id="conexion-estado">Conectando con la nube...</p>
        </div>
    </div>

    <script>
        // Configuración oficial de Firebase para Kargass
        const firebaseConfig = {
            apiKey: "AIzaSyD...", // Tu clave activa
            authDomain: "kargass-apk.firebaseapp.com",
            databaseURL: "https://kargass-apk-default-rtdb.firebaseio.com",
            projectId: "kargass-apk",
            storageBucket: "kargass-apk.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const dbRef = firebase.database().ref('kargass_app_data');

        // Escucha activa en tiempo real con .on
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            document.getElementById('conexion-estado').innerText = "¡Conectado y sincronizado en tiempo real!";
            console.log("Datos actualizados desde la nube:", data);
        }, (error) => {
            document.getElementById('conexion-estado').innerText = "Error de sincronización con la base de datos.";
            console.error(error);
        });
    </script>
</body>
</html>
